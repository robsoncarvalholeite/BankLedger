version: '3.8'

services:
  bankledger-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankledger-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - SNAPSHOT_INTERVAL_MINUTES=5
      - SQLITE_CONNECTION_STRING=Data Source=/app/data/bank.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
